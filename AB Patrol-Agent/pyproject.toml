[project]
name = "ab-patrol-agent"
version = "0.1.0"
description = "Al Brooks patrol runtime and tooling"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
