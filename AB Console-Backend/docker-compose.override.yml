# docker-compose.override.yml - 开发环境覆盖配置
#
# 此文件在 `docker-compose up` 时自动加载，提供开发环境特有的配置：
#   - 源代码热重载（volume 映射本地代码目录）
#   - 调试模式
#   - 详细日志
#
# 生产环境使用:
#   docker-compose -f docker-compose.yml up -d
# 开发环境使用（默认）:
#   docker-compose up -d
#
services:
  data-service:
    volumes:
      - ./services/data-service/src:/app/src
      - ./libs:/app/libs
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT

  trading-service:
    volumes:
      - ./services/trading-service/src:/app/src
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT

  signal-service:
    volumes:
      - ./services/signal-service/src:/app/src
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT

  telegram-service:
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT

  sync-service:
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT

  api-service:
    volumes:
      - ./services-preview/api-service/src:/app/src
      - ./services/data-service/src:/app/data_service_src
      - ./libs:/app/libs
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,AAVEUSDT,ADAUSDT,AVAXUSDT
      - PYTHONPATH=/app/src:/app/libs:/app/data_service_src
