# docker-compose.override.yml - 开发环境覆盖配置
#
# 此文件在 `docker-compose up` 时自动加载，提供开发环境特有的配置：
#   - 源代码热重载（volume 映射本地代码目录）
#   - 调试模式
#   - 详细日志
#
# 生产环境使用:
#   docker-compose -f docker-compose.yml up -d
# 开发环境使用（默认）:
#   docker-compose up -d
#
version: '3.8'

services:
  data-service:
    volumes:
      - ./services/data-service/src:/app/src
      - ./libs:/app/libs
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT

  trading-service:
    volumes:
      - ./services/trading-service/src:/app/src
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT

  signal-service:
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT

  telegram-service:
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT

  sync-service:
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT

  api-service:
    volumes:
      - ./services-preview/api-service/src:/app/src
      - ./services/data-service/src:/app/data_service_src
      - ./libs:/app/libs
    environment:
      - LOG_LEVEL=DEBUG
      - SYMBOLS_GROUPS=main4
      - SYMBOLS_GROUP_main4=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT
      - PYTHONPATH=/app/src:/app/libs:/app/data_service_src

  web-dashboard:
    environment:
      - NEXT_PUBLIC_API_URL=http://api-service:8088
      - NEXT_PUBLIC_WS_URL=ws://api-service:8088
