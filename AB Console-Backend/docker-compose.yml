version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ab-timescaledb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_data
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab-console-network

  # 官方 API Service (预览版)
  api-service:
    build:
      context: ./services-preview/api-service
      dockerfile: Dockerfile
    container_name: ab-api-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - API_HOST=0.0.0.0
      - API_PORT=8088
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  # 核心服务
  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: ab-data-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  trading-service:
    build:
      context: ./services/trading-service
      dockerfile: Dockerfile
    container_name: ab-trading-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  # Signal Service - Al Brooks 信号检测
  signal-service:
    build:
      context: ./services/signal-service
      dockerfile: Dockerfile
    container_name: ab-signal-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - SQLITE_DB_PATH=/app/data/signals.db
      - COOLDOWN_DB_PATH=/app/data/cooldown.db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app/libs
    command: bash -c "pip install psycopg[binary] -q && python -m src --all"
    volumes:
      # 映射本地代码目录，方便修改
      - ./services/signal-service/src:/app/src
      - ./libs:/app/libs
      # 数据持久化
      - signal_data:/app/data
      # 日志目录
      - ./services/signal-service/logs:/app/logs
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network
    # 使用 host 网络模式以便访问本机 Clawdbot webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Telegram Service - 完整功能（Bot + API）
  telegram-service:
    build:
      context: ./services/telegram-service
      dockerfile: Dockerfile
    container_name: ab-telegram-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - BOT_TOKEN=8507333164:AAG_ObiNaxYww6V5T2XyK7Rm01EIj-VEaFw
      - TELEGRAM_BOT_TOKEN=8507333164:AAG_ObiNaxYww6V5T2XyK7Rm01EIj-VEaFw
      - CLAWDBOT_WEBHOOK=http://host.docker.internal:18789/webhook/albrooks
      - WEBHOOK_MODE=false
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app/libs
      # Docker 路径配置
      - PROJECT_ROOT=/app
      - SIGNAL_SERVICE_SRC=/app/services/signal-service/src
      - LIBS_PATH=/app/libs
    volumes:
      # 完整映射，保留所有功能
      - ./services/telegram-service/src:/app/src
      - ./services/telegram-service/config:/app/config
      - ./services/signal-service/src:/app/services/signal-service/src
      - ./libs:/app/libs
      - ./services/telegram-service/logs:/app/logs
    working_dir: /app
    command: bash -c "pip install fastapi uvicorn pydantic -q && python -m src.bot.app"
    depends_on:
      timescaledb:
        condition: service_healthy
      signal-service:
        condition: service_started
    networks:
      - ab-console-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 自动转发服务 - 发送详版给 Telegram Bot (本地构建)
  forwarder:
    build:
      context: ./forwarder
      dockerfile: Dockerfile
    container_name: ab-forwarder
    restart: unless-stopped
    environment:
      - TELEGRAM_API=http://telegram-service:8090/api/catbo-forward
      - USER_ID=756069822
      - SIGNAL_FILE=/app/signals/signals.jsonl
    volumes:
      - /tmp/clawdbot_signals.jsonl:/app/signals/signals.jsonl:ro
      - forwarder_data:/app/data
    depends_on:
      - telegram-service
    networks:
      - ab-console-network

volumes:
  timescaledb_data:
    driver: local
  signal_data:
    driver: local
  forwarder_data:
    driver: local

networks:
  ab-console-network:
    driver: bridge
