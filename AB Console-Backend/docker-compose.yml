version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ab-timescaledb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_data
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab-console-network

  # 官方 API Service (预览版)
  api-service:
    build:
      context: .
      dockerfile: services-preview/api-service/Dockerfile
    container_name: ab-api-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - API_HOST=0.0.0.0
      - API_PORT=8088
      - PYTHONPATH=/app/src:/app/libs
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  # 核心服务
  data-service:
    build:
      context: .
      dockerfile: services/data-service/Dockerfile
    container_name: ab-data-service
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8085:8085"  # WebSocket 中继（实时 K 线）
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  trading-service:
    build:
      context: ./services/trading-service
      dockerfile: Dockerfile
    container_name: ab-trading-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app/libs
    volumes:
      - market_data:/app/data            # 写入 market_data.db (共享给其他服务)
      - ./libs:/app/libs                 # 共享库
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      timescaledb:
        condition: service_healthy
      data-service:
        condition: service_healthy
    networks:
      - ab-console-network

  # Sync Service - Obsidian 数据同步
  sync-service:
    build:
      context: ./services/sync-service
      dockerfile: Dockerfile
    container_name: ab-sync-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./services/sync-service/src:/app/src
      - ./services/sync-service/data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  # Signal Service - Al Brooks 信号检测
  signal-service:
    build:
      context: ./services/signal-service
      dockerfile: Dockerfile
    container_name: ab-signal-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - SQLITE_DB_PATH=/app/data/signals.db
      - COOLDOWN_DB_PATH=/app/data/cooldown.db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app/libs
    command: bash -c "pip install psycopg[binary] -q && python -m src --realtime --health-port 8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # 映射本地代码目录，方便修改
      - ./services/signal-service/src:/app/src
      - ./libs:/app/libs
      # 数据持久化
      - signal_data:/app/data
      # 只读访问 trading-service 的指标数据
      - market_data:/app/market-data:ro
      # 日志目录
      - ./services/signal-service/logs:/app/logs
    depends_on:
      timescaledb:
        condition: service_healthy
      trading-service:
        condition: service_started
    networks:
      - ab-console-network
    # 使用 host 网络模式以便访问本机 Clawdbot webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Telegram Service - 完整功能（Bot + API）
  telegram-service:
    build:
      context: ./services/telegram-service
      dockerfile: Dockerfile
    container_name: ab-telegram-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - CLAWDBOT_WEBHOOK_URL=${CLAWDBOT_WEBHOOK_URL:-http://host.docker.internal:18789/hooks/al-brooks-signal}
      - CLAWDBOT_THRESHOLD=${CLAWDBOT_THRESHOLD:-75}
      - WEBHOOK_MODE=false
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/ai-service:/app/src:/app/libs
      - PROJECT_ROOT=/app
      - SIGNAL_SERVICE_SRC=/app/services/signal-service/src
      - LIBS_PATH=/app/libs
      - AI_SERVICE_PATH=/app/ai-service
      - BOT_TOKEN=8507333164:AAG_ObiNaxYww6V5T2XyK7Rm01EIj-VEaFw
      # AI/LLM 配置
      - LLM_BACKEND=api
      - LLM_API_BASE_URL=https://api.moonshot.cn/v1
      - EXTERNAL_API_KEY=sk-kimi-TcQKBNT8lRJRS0eHChAQRaMiENbq4S5vNcmZz1K0hd7dLl5QpDvj2HOXZwfpCfEY
      - LLM_MODEL=moonshot-v1-8k
      - LLM_MAX_TOKENS=32000
    volumes:
      # 完整映射，保留所有功能
      - ./services/telegram-service/src:/app/src
      - ./services/telegram-service/config:/app/config
      - ./services/signal-service/src:/app/services/signal-service/src
      - ./services/ai-service:/app/ai-service
      - ./libs:/app/libs
      - ./services/telegram-service/logs:/app/logs
      - market_data:/app/market-data:ro  # 只读访问 trading-service 的指标数据
      # 信号文件映射到宿主机，供 OpenClaw 读取
      - ~/.clawdbot/signals:/root/.clawdbot/signals
    working_dir: /app
    command: bash -c "pip install fastapi uvicorn pydantic -q && python -m src.bot.app"
    depends_on:
      timescaledb:
        condition: service_healthy
      signal-service:
        condition: service_started
    networks:
      - ab-console-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 自动转发服务 - 已废弃，保留配置但不自动启动
  # 如需启动: docker compose --profile deprecated up forwarder
  forwarder:
    profiles: ["deprecated"]  # 不自动启动
    image: python:3.11-slim
    container_name: ab-forwarder
    restart: unless-stopped
    environment:
      - TELEGRAM_API=http://telegram-service:8090/api/catbo-forward
      - SIGNAL_FILE=/app/signals/signals.jsonl
      - USER_ID=${TELEGRAM_USER_ID:-756069822}
    volumes:
      - /tmp/openclaw_signals.jsonl:/app/signals/signals.jsonl:ro
      - forwarder_data:/app/data
      - ./forwarder/simple_forwarder.py:/app/simple_forwarder.py:ro
    command: >
      sh -c "pip install --no-cache-dir requests && python -u /app/simple_forwarder.py"
    depends_on:
      - telegram-service
    networks:
      - ab-console-network

  # Web Dashboard - Next.js 前端
  web-dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://api-service:8088
        - NEXT_PUBLIC_WS_URL=ws://api-service:8088
        - NEXT_PUBLIC_SYNC_API_URL=http://sync-service:8089
    container_name: ab-web-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api-service
    networks:
      - ab-console-network

  # ========================================
  # Autoheal - 自动重启 unhealthy 的容器
  # ========================================
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ab-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all  # 监控所有带 healthcheck 的容器
      - AUTOHEAL_INTERVAL=60          # 每 60 秒检查一次
      - AUTOHEAL_START_PERIOD=300     # 启动后 5 分钟开始检查
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ab-console-network

volumes:
  timescaledb_data:
    driver: local
  market_data:        # trading-service 写入指标, telegram/signal 只读访问
    driver: local
  signal_data:
    driver: local
  forwarder_data:
    driver: local

networks:
  ab-console-network:
    driver: bridge
