version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ab-timescaledb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_data
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab-console-network

  # 官方 API Service (预览版)
  api-service:
    build:
      context: ./services-preview/api-service
      dockerfile: Dockerfile
    container_name: tradecat-api-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
      - API_HOST=0.0.0.0
      - API_PORT=8088
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  # 核心服务
  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: tradecat-data-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

  trading-service:
    build:
      context: ./services/trading-service
      dockerfile: Dockerfile
    container_name: tradecat-trading-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/market_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ab-console-network

volumes:
  timescaledb_data:
    driver: local

networks:
  ab-console-network:
    driver: bridge
